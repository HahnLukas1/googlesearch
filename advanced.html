<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Advanced Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page page-advanced">
  <header class="site-header advanced-header">
    <a href="index.html" class="small-google-logo" aria-label="Google Search home">
      <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
    </a>
    <nav class="top-nav" aria-label="Navigation">
      <a href="index.html">Google Search</a>
    </nav>
  </header>

  <main class="advanced-main">
    <h1 class="advanced-title">Advanced Search</h1>
    <div class="advanced-divider"></div>

    <section class="advanced-container" aria-labelledby="find-pages-title">
      <h2 id="find-pages-title">Find pages with...</h2>
      <form action="https://www.google.com/search" method="get" class="advanced-form" role="search">
        <label for="all-words">all these words:</label>
        <input id="all-words" type="text" name="as_q" autocomplete="off">

        <label for="exact-phrase">this exact word or phrase:</label>
        <input id="exact-phrase" type="text" name="as_epq" autocomplete="off">

        <label for="any-words">any of these words:</label>
        <input id="any-words" type="text" name="as_oq" autocomplete="off">

        <label for="none-words">none of these words:</label>
        <input id="none-words" type="text" name="as_eq" autocomplete="off">

        <div class="advanced-actions">
          <button class="advanced-button" type="submit">Advanced Search</button>
        </div>
      </form>
    </section>
  </main>
  <footer class="site-footer">Czechia</footer>
</body>
</html>
